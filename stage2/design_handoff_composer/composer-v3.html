<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Composer — v2 (Figma-inspired)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root{
    /* Shell tokens (kept from spec) */
    --canvas:#F8F7F4; --bg:#F1EFEA; --surface:#FFFFFF; --surface-muted:#F1EFEA;
    --border:#D9D5CC; --border-strong:#C8C2B7; --hairline:#E8E4DB;
    --ink:#1F1F1B; --ink-default:#35342F; --ink-muted:#6A685F; --ink-subtle:#99958C;
    --hover:#ECE9E2;
    --primary:#E58A2A; --primary-hover:#C96F12; --primary-soft:#F6E2C8;
    --primary-tint:#FDF5ED; --primary-text:#4A2500;
    --c-context-bg:#FEF8EE; --c-context-border:#F3DFC2; --c-context-text:#8C5510;
    --c-selected-bg:#DDF1F5; --c-selected-border:#BFDDE5; --c-selected-text:#123C44;
    --c-selected-ring:rgba(167,215,227,0.45);
    --info:#3E7FC4; --info-soft:#E4EFFA;

    /* v2 additions — slightly deeper chrome surface so Figma-style
       chrome reads as "panel" against the canvas */
    --chrome:#FAF8F4;
    --chrome-hover:#F0EDE6;
    --shadow-elev:0 1px 2px rgba(40,30,15,0.06), 0 0 0 1px rgba(40,30,15,0.04);
    --shadow-float:0 6px 20px -8px rgba(40,30,15,0.18), 0 1px 2px rgba(40,30,15,0.08), 0 0 0 1px rgba(40,30,15,0.05);

    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#EEEBE4;color:var(--ink-default);font-family:var(--font-sans);font-size:12px;line-height:1.4;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  input{font-family:inherit;font-size:inherit;color:inherit}
  ::selection{background:var(--c-selected-bg);color:var(--c-selected-text)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#D5D0C3;border:2px solid transparent;background-clip:padding-box;border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:#B8B2A4;border:2px solid transparent;background-clip:padding-box}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="composer-icons-v1.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="composer-app-v3.jsx"></script>
</body>
</html>
